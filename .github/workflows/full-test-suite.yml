name: Full Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  appium-tests:
    name: Appium Tests - Group ${{ matrix.group }}
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            specs: "tests/smoke.test.js,tests/auth_extended.test.js"
          - group: 2
            specs: "tests/dashboard_extended.test.js,tests/navigation_extended.test.js"
          - group: 3
            specs: "tests/apps_extended.test.js,tests/settings_extended.test.js"
          - group: 4
            specs: "tests/network_extended.test.js,tests/analytics_extended.test.js"
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: appium-tests/package.json

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/

      - name: Install Appium and Drivers
        shell: bash
        run: |
          cd appium-tests
          npm install
          if ! npx appium driver list --installed | grep -q "uiautomator2"; then
            npx appium driver install uiautomator2
          else
            npx appium driver update uiautomator2
          fi

      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd appium-tests
            chmod +x run_tests.sh
            TEST_SPEC="${{ matrix.specs }}" REPORT_NAME="appium-report-group${{ matrix.group }}" ./run_tests.sh

      - name: Upload Appium Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-report-group${{ matrix.group }}
          path: appium-tests/reports/appium-report-group${{ matrix.group }}.xlsx
          retention-days: 14

      - name: Upload Appium Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-evidence-group${{ matrix.group }}
          path: |
            appium-server.log
            appium-stdout.log
            appium-tests/screenshots/
          retention-days: 14

  load-tests:
    name: Load Tests & Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: load-tests/package.json

      - name: Install k6
        run: |
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Install Dependencies
        run: |
          cd load-tests
          npm install

      - name: Run Baseline Load Test
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd load-tests
          npm run test:baseline || echo "Load tests failed"

      - name: Generate Load Test Report
        if: always()
        run: |
          cd load-tests
          npm run report

      - name: Upload Load Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load-tests/reports/load-test-report.xlsx
          retention-days: 14

  security-tests:
    name: Security Assessment & Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: security-tests/package.json

      - name: Install Dependencies
        run: |
          cd security-tests
          npm install

      - name: Run Security Scans
        run: |
          cd security-tests
          npm run scan:secrets
          npm run scan:dependencies
          npm run scan:sast

      - name: Generate Security Reports
        if: always()
        run: |
          cd security-tests
          npm run report

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-reports
          path: security-tests/reports/*.xlsx
          retention-days: 14

  final-summary:
    name: Final Test Suite Summary
    runs-on: ubuntu-latest
    needs: [appium-tests, load-tests, security-tests]
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports/
        continue-on-error: true

      - name: Create Combined Report Folder
        run: |
          mkdir -p combined-reports/appium
          mkdir -p combined-reports/load
          mkdir -p combined-reports/security
          # Find all appium reports and copy them
          find all-reports/ -name "appium-report-group*.xlsx" -exec cp {} combined-reports/appium/ \;
          find all-reports/ -name "load-test-report.xlsx" -exec cp {} combined-reports/load/ \;
          find all-reports/ -name "*.xlsx" | grep security | xargs -I {} cp {} combined-reports/security/ || true

      - name: Upload Combined Reports
        uses: actions/upload-artifact@v4
        with:
          name: complete-test-reports
          path: combined-reports/
          retention-days: 14

      - name: Generate GitHub Summary
        run: |
          echo "# FULL TEST SUITE SUMMARY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite          | Result | Report Status |" >> $GITHUB_STEP_SUMMARY
          echo "| ------------------- | ------ | ------------- |" >> $GITHUB_STEP_SUMMARY
          
          # Appium Result
          if [ "${{ needs.appium-tests.result }}" == "success" ]; then
            echo "| Appium Android E2E  | ✅ PASS | Artifacts Uploaded |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Appium Android E2E  | ❌ FAIL | Check Shards |" >> $GITHUB_STEP_SUMMARY
          fi

          # Load Result
          if [ "${{ needs.load-tests.result }}" == "success" ]; then
            echo "| Load Testing        | ✅ PASS | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Load Testing        | ❌ FAIL | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          fi

          # Security Result
          if [ "${{ needs.security-tests.result }}" == "success" ]; then
            echo "| Security Assessment | ✅ PASS | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Assessment | ⚠️ ISSUE | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          fi
