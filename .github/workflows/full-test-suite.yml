name: Full Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-tests:
    name: Appium Android E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: appium-tests/package.json

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Install Appium and Drivers
        # REFACTOR: Use bash explicitly to ensure consistent shell behavior for multi-line if/else
        shell: bash
        run: |
          cd appium-tests
          npm install
          echo "Checking currently installed Appium drivers..."
          npx appium driver list --installed
          
          # Idempotent installation of uiautomator2 using a single shell process
          if ! npx appium driver list --installed | grep -q "uiautomator2"; then
            echo "Installing uiautomator2 driver..."
            npx appium driver install uiautomator2
          else
            echo "UIAutomator2 driver already installed. Updating..."
            npx appium driver update uiautomator2
          fi

      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          # REFACTOR: Using a single script block. We ensure the entire script is treated as one by the action.
          # To be absolutely sure it runs in a single Bash process, we could write it to a file, 
          # but the action's 'script' property is designed for this. 
          # We've improved the syntax to be strictly POSIX/Bash compatible.
          script: |
            #!/bin/bash
            set -e
            
            echo "[$(date)] Starting emulator diagnostics..."
            adb devices
            
            echo "[$(date)] Waiting for emulator boot (sys.boot_completed)..."
            max_retries=30
            counter=1
            boot_completed=0
            
            while [ $counter -le $max_retries ]; do
              # Get boot status and remove carriage return characters
              status=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$status" = "1" ]; then
                echo "[$(date)] Emulator boot completed successfully!"
                boot_completed=1
                break
              fi
              echo "[$(date)] Still waiting for boot... ($counter/$max_retries)"
              sleep 10
              counter=$((counter + 1))
            done
            
            if [ "$boot_completed" -ne 1 ]; then
              echo "ERROR: Emulator failed to boot within 5 minutes."
              adb shell getprop init.svc.bootanim
              exit 1
            fi

            echo "[$(date)] Unlocking emulator screen..."
            adb shell input keyevent 82
            
            echo "[$(date)] Verifying APK existence..."
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            if [ ! -f "$APK_PATH" ]; then
              echo "ERROR: APK not found at $APK_PATH"
              exit 1
            fi
            ls -lh "$APK_PATH"

            echo "[$(date)] Starting Appium server..."
            cd appium-tests
            # Use nohup and redirect to ensure it stays in background
            nohup npx appium --log ../appium-server.log --address 127.0.0.1 --port 4723 --base-path / > ../appium-stdout.log 2>&1 &
            
            echo "[$(date)] Waiting for Appium server to be ready..."
            appium_ready=0
            counter=1
            while [ $counter -le 30 ]; do
              if curl -s http://127.0.0.1:4723/status | grep -q "\"ready\":true"; then
                echo "[$(date)] Appium server is ready and accepting requests!"
                appium_ready=1
                break
              fi
              echo "Waiting for Appium server status... ($counter/30)"
              sleep 2
              counter=$((counter + 1))
            done

            if [ "$appium_ready" -ne 1 ]; then
              echo "ERROR: Appium server failed to start within 60 seconds."
              cat ../appium-server.log
              exit 1
            fi

            echo "[$(date)] Running Appium Tests..."
            # Run tests and capture exit code
            TEST_EXIT_CODE=0
            npm test || TEST_EXIT_CODE=$?
            
            if [ $TEST_EXIT_CODE -ne 0 ]; then
              echo "Tests failed during execution."
              TESTS_FAILED=true
            fi
            
            echo "[$(date)] Generating execution report..."
            npm run report || echo "Report generation failed."
            
            if [ "$TESTS_FAILED" = "true" ]; then
              exit 1
            fi

      - name: Capture Logcat
        if: always()
        run: adb logcat -d > logcat.log

      - name: Upload Appium Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-report
          path: appium-tests/reports/appium-test-report.xlsx
          retention-days: 14

      - name: Upload Appium Logs & Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-evidence
          path: |
            appium-server.log
            appium-stdout.log
            logcat.log
            appium-tests/screenshots/
          retention-days: 14

  load-tests:
    name: Load Tests & Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: load-tests/package.json

      - name: Install k6
        run: |
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Install Dependencies
        run: |
          cd load-tests
          npm install

      - name: Run Baseline Load Test
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd load-tests
          npm run test:baseline || echo "Load tests failed"

      - name: Generate Load Test Report
        if: always()
        run: |
          cd load-tests
          npm run report

      - name: Upload Load Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load-tests/reports/load-test-report.xlsx
          retention-days: 14

  security-tests:
    name: Security Assessment & Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: security-tests/package.json

      - name: Install Dependencies
        run: |
          cd security-tests
          npm install

      - name: Run Security Scans
        run: |
          cd security-tests
          npm run scan:secrets
          npm run scan:dependencies
          npm run scan:sast

      - name: Generate Security Reports
        if: always()
        run: |
          cd security-tests
          npm run report

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-reports
          path: security-tests/reports/*.xlsx
          retention-days: 14

      - name: Upload Security Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-summaries
          path: |
            security-tests/reports/*.md
          retention-days: 14

  final-summary:
    name: Final Test Suite Summary
    runs-on: ubuntu-latest
    needs: [appium-tests, load-tests, security-tests]
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Appium Report
        uses: actions/download-artifact@v4
        with:
          name: appium-test-report
          path: reports/appium/
        continue-on-error: true

      - name: Download Load Test Report
        uses: actions/download-artifact@v4
        with:
          name: load-test-report
          path: reports/load/
        continue-on-error: true

      - name: Download Security Reports
        uses: actions/download-artifact@v4
        with:
          name: security-test-reports
          path: reports/security/
        continue-on-error: true

      - name: Create Combined Report
        run: |
          mkdir -p combined-reports/appium
          mkdir -p combined-reports/load
          mkdir -p combined-reports/security
          cp reports/appium/*.xlsx combined-reports/appium/ || true
          cp reports/load/*.xlsx combined-reports/load/ || true
          cp reports/security/*.xlsx combined-reports/security/ || true

      - name: Upload Combined Reports
        uses: actions/upload-artifact@v4
        with:
          name: complete-test-reports
          path: combined-reports/
          retention-days: 14

      - name: Generate GitHub Summary
        run: |
          echo "# FULL TEST SUITE SUMMARY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite          | Result | Report Status |" >> $GITHUB_STEP_SUMMARY
          echo "| ------------------- | ------ | ------------- |" >> $GITHUB_STEP_SUMMARY
          
          # Appium Result
          if [ "${{ needs.appium-tests.result }}" == "success" ]; then
            echo "| Appium Android E2E  | ✅ PASS | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Appium Android E2E  | ❌ FAIL | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          fi

          # Load Result
          if [ "${{ needs.load-tests.result }}" == "success" ]; then
            echo "| Load Testing        | ✅ PASS | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Load Testing        | ❌ FAIL | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          fi

          # Security Result
          if [ "${{ needs.security-tests.result }}" == "success" ]; then
            echo "| Security Assessment | ✅ PASS | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Assessment | ⚠️ ISSUE | Artifact Uploaded |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **Appium**: appium-test-report" >> $GITHUB_STEP_SUMMARY
          echo "- **Load**: load-test-report" >> $GITHUB_STEP_SUMMARY
          echo "- **Security**: security-test-reports" >> $GITHUB_STEP_SUMMARY
          echo "- **Combined**: complete-test-reports" >> $GITHUB_STEP_SUMMARY
